name: Build WinDivert - Optimized Kernel Driver

on:
  workflow_dispatch:
    inputs:
      driver_icf:
        description: 'Enable driver /OPT:ICF (experimental; default off)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  optimized-build:
    name: Optimized WinDivert VS${{ matrix.vs }} (x86/x64 DLL, x64 driver)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vs: '2022'
            runner: windows-2022
          - vs: '2026'
            runner: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Edits only this runner's checkout. The repository's original
      # build-windivert-modern.yml and sys/windivert.vcxproj remain unchanged.
      - name: Enable kernel Release optimizations in the temporary checkout
        shell: pwsh
        env:
          DRIVER_ICF: ${{ inputs.driver_icf }}
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'sys/windivert.vcxproj'
          if (-not (Test-Path -LiteralPath $project)) { throw "Missing $project" }
          $source = [System.IO.File]::ReadAllText((Resolve-Path $project).Path)
          $needle = ' <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />'
          if (-not $source.Contains($needle)) {
              throw 'Cannot locate Microsoft.Cpp.targets import in driver project'
          }
          $icf = if ($env:DRIVER_ICF -eq 'true') { 'true' } else { 'false' }
          $settings = @'
           <!-- CI-only optimized Release x64 driver settings. No AVX2 in kernel mode. -->
           <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
            <WholeProgramOptimization>true</WholeProgramOptimization>
            <LinkIncremental>false</LinkIncremental>
           </PropertyGroup>
           <ItemDefinitionGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
            <ClCompile>
             <Optimization>MaxSpeed</Optimization>
             <IntrinsicFunctions>true</IntrinsicFunctions>
             <FunctionLevelLinking>true</FunctionLevelLinking>
             <WholeProgramOptimization>true</WholeProgramOptimization>
            </ClCompile>
            <Link>
             <LinkTimeCodeGeneration>UseLinkTimeCodeGeneration</LinkTimeCodeGeneration>
             <OptimizeReferences>true</OptimizeReferences>
             <EnableCOMDATFolding>__ICF__</EnableCOMDATFolding>
            </Link>
           </ItemDefinitionGroup>
          '@
          $settings = $settings.Replace('__ICF__', $icf)
          $updated = $source.Replace($needle, $settings + "`r`n" + $needle)
          # Fail early if the inserted XML is invalid; do not continue to MSBuild.
          $null = [xml]$updated
          [System.IO.File]::WriteAllText((Resolve-Path $project).Path, $updated)
          Write-Host "Optimized driver: /O2 /Oi /Gy /GL /LTCG /OPT:REF; /OPT:ICF=$icf"
          Write-Host 'Original repository project files are not committed or pushed.'

      - name: Build DLLs, examples and optimized x64 driver
        shell: pwsh
        env:
          VS_VERSION: ${{ matrix.vs }}
        run: |
          $ErrorActionPreference = 'Stop'
          $flags = @{
              VSVersion = $env:VS_VERSION
              Architecture = 'Both'
              IncludeDriver = $true
          }
          & ./msvc-build-modern.ps1 @flags
          if (-not $?) { throw 'WinDivert build failed' }

      # Use Windows PowerShell 5.1 for PKI operations: avoids known
      # New-SelfSignedCertificate problems in PowerShell 7.5 on some systems.
      # Splitting these steps makes a stalled operation easy to identify.
      - name: Create disposable test-signing certificate
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '[cert 1/3] Creating code-signing certificate (Windows PowerShell 5.1)'
          $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject 'CN=WinDivert Optimized CI Test' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 `
              -KeyExportPolicy NonExportable `
              -NotAfter (Get-Date).AddYears(2)
          if (-not $cert -or -not $cert.HasPrivateKey) {
              throw 'Certificate creation failed: no certificate or private key'
          }
          Write-Host '[cert 2/3] Exporting public certificate'
          $publicCert = Join-Path (Resolve-Path 'install/MSVC').Path 'WinDivert-Optimized-Test.cer'
          Export-Certificate -Cert $cert -FilePath $publicCert -Force | Out-Null
          Write-Host '[cert 3/3] Making thumbprint available to the signing step'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TEST_CERT_SHA1=$($cert.Thumbprint)`n", $utf8)
          Write-Host "Certificate created: $($cert.Thumbprint)"
          # No need to trust this throwaway root on the GitHub runner.
          # The test VM needs to trust the public certificate separately.

      - name: Test-sign WinDivert64.sys
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = (Resolve-Path 'install/MSVC/amd64/WinDivert64.sys').Path
          $publicCert = (Resolve-Path 'install/MSVC/WinDivert-Optimized-Test.cer').Path
          if (-not $env:TEST_CERT_SHA1) { throw 'Missing test certificate thumbprint' }

          Write-Host '[sign 1/3] Locating SignTool'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          if (-not (Test-Path -LiteralPath $sdkBin)) {
              throw "Windows SDK tools not found: $sdkBin"
          }
          $tools = @(Get-ChildItem -Path (Join-Path $sdkBin '*/x64/signtool.exe') -File -ErrorAction SilentlyContinue |
              Sort-Object -Property FullName -Descending)
          if ($tools.Count -eq 0) { throw "signtool.exe (x64) not found under $sdkBin" }
          $signTool = $tools[0].FullName
          Write-Host "Using SignTool: $signTool"

          Write-Host '[sign 2/3] Signing driver'
          & $signTool sign /v /fd SHA256 /s My /sha1 $env:TEST_CERT_SHA1 $driver
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed ($LASTEXITCODE)" }

          Write-Host '[sign 3/3] Checking embedded signer certificate'
          # A self-signed certificate is untrusted on this disposable runner.
          # Do not run network-dependent chain/revocation verification here;
          # check the embedded signer and the successful SignTool exit code.
          $signature = Get-AuthenticodeSignature -FilePath $driver
          if (-not $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $env:TEST_CERT_SHA1 -or
              $signature.Status -eq 'NotSigned' -or
              $signature.Status -eq 'HashMismatch') {
              throw "Missing or mismatched Authenticode signature: $($signature.Status)"
          }
          Write-Host "Driver signed. Signature status on untrusted runner: $($signature.Status)"
          Write-Host "Public certificate: $publicCert"
          Write-Host 'This is a TEST signature, not Microsoft production kernel signing.'

      - name: Package optimized binaries
        shell: pwsh
        env:
          VS_VERSION: ${{ matrix.vs }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($folder in @('install/MSVC/i386', 'install/MSVC/amd64')) {
              foreach ($file in @('WinDivert.dll', 'WinDivert.lib')) {
                  $path = Join-Path $folder $file
                  if (-not (Test-Path -LiteralPath $path)) { throw "Missing $path" }
              }
          }
          $driver = 'install/MSVC/amd64/WinDivert64.sys'
          if (-not (Test-Path -LiteralPath $driver)) { throw "Missing optimized driver: $driver" }
          $publicCert = 'install/MSVC/WinDivert-Optimized-Test.cer'
          if (-not (Test-Path -LiteralPath $publicCert)) { throw "Missing test certificate: $publicCert" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = "dist/WinDivert-Optimized-TestSigned-VS$env:VS_VERSION.zip"
          Compress-Archive -Path 'install/MSVC' -DestinationPath $zip -CompressionLevel Optimal -Force
          Write-Host "Packaged $zip"

      - name: Upload optimized build
        uses: actions/upload-artifact@v4
        with:
          name: WinDivert-Optimized-TestSigned-VS${{ matrix.vs }}
          path: dist/WinDivert-Optimized-TestSigned-VS${{ matrix.vs }}.zip
          if-no-files-found: error
          retention-days: 30
